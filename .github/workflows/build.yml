name: Build APK and Increment Version

on:
  release:
    types: [published]

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/app-release.apk

  increment_version:
    name: Increment version and create PR
    needs: build_apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Increment version
        run: |
          # Read current version
          current_version=$(grep -o 'versionName = "[0-9.]*"' app/build.gradle.kts | sed 's/versionName = "//' | sed 's/"//')
          echo "Current version: $current_version"

          # Increment minor version (e.g., 1.0 -> 1.1, 1.9 -> 1.10)
          major=$(echo $current_version | cut -d. -f1)
          minor=$(echo $current_version | cut -d. -f2)
          new_minor=$((minor + 1))
          new_version="$major.$new_minor"
          echo "New version: $new_version"
          echo "NEW_VERSION=$new_version" >> $GITHUB_ENV

          # Update build.gradle.kts
          sed -i "s/versionName = \"$current_version\"/versionName = \"$new_version\"/" app/build.gradle.kts
          echo "Updated app/build.gradle.kts"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b chore/version-bump-$new_version
          git add app/build.gradle.kts
          git commit -m "chore: Bump version to $new_version"
          git push origin chore/version-bump-$new_version

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Bump version to new_version (automated)
          title: 'Bump version to new_version'
          body: 'Automated PR to bump app version after release.'
          branch: version-bump-${{ env.NEW_VERSION }} # NEW_VERSION needs to be set from previous step
          base: main # Or your default branch
          labels: automated pr, version bump
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
